nodes:
  - node_id: llm#1
    title: "LLM #1"
    inputs_from:
      - handle: timeout
        value: 30
      - handle: retry_times
        value: 0
      - handle: retry_sleep
        value: 3.5
      - handle: stream
        value: true
      - handle: model
        value:
          model: deepseek-chat
          temperature: 0
          top_p: 0.5
          max_tokens: 4096
        from_node:
          []
      - handle: template
        value:
          - role: system
            content: Read the markdown file {{input}}, analyze the comic picture addresses
              from it, and sort the page numbers in order. output output as an
              address array
        schema_overrides:
          - schema:
              type: array
        from_node:
          []
      - handle: input
        value: ""
        from_node:
          - node_id: crawler#1
            output_handle: content
    task: llm::llm
    inputs_def:
      - handle: input
        description: "Markdown content containing comic page information to analyze"
        json_schema:
          type: string
    outputs_def:
      - handle: output
        description: "Array of sorted comic image URLs extracted from the markdown content"
        json_schema:
          type: array
          items:
            type: string
  - node_id: map#1
    title: "Map #1"
    inputs_from:
      - handle: array
        from_node:
          - node_id: llm#1
            output_handle: output
    subflow: array::map
    slots:
      - slot_node_id: +slot#2
        slotflow: self::+slotflow#1
  - node_id: archive#1
    title: "Archive images #1"
    inputs_from:
      - handle: images
        value:
          []
        from_node:
          - node_id: filter_files#1
            output_handle: files
      - handle: format
        value: epub
      - handle: title
        value: null
      - handle: author
        value: null
      - handle: reading_order
        value: to-right
      - handle: archive_path
        value:
        from_node:
          - node_id: +python#2
            output_handle: pack_path
    task: manga-tools::archive
  - node_id: filter_files#1
    title: "Filter Files #1"
    inputs_from:
      - handle: files
        from_node:
          - node_id: map#1
            output_handle: array
      - handle: type
        value: image
    task: oomol-file::filter_files
  - node_id: +python#2
    title: File Path
    icon: ":carbon:file-storage:"
    task:
      ui:
        default_width: 450
      inputs_def:
        - handle: name
          description: "Comic name for generating the output file name"
          json_schema:
            type: string
          nullable: false
        - handle: save_dir
          description: "Directory where the comic archive file will be saved"
          json_schema:
            type: string
            ui:widget: dir
          nullable: false
      outputs_def:
        - handle: pack_path
          description: "Full path to the generated comic archive file (CBZ, EPUB, or PDF)"
          json_schema:
            type: string
            ui:widget: save
            ui:options:
              excludeAll: true
              filters:
                - name: CBZ
                  extensions:
                    - cbz
                - name: EPUB
                  extensions:
                    - epub
                - name: PDF
                  extensions:
                    - pdf
          nullable: true
      executor:
        name: python
        options:
          entry: scriptlets/+scriptlet#3.py
    inputs_from:
      - handle: name
        from_node:
          - node_id: llm#2
            output_handle: name
      - handle: save_dir
        from_flow:
          - input_handle: save_dir
        from_node:
          []
  - node_id: crawler#1
    title: "Crawler #1"
    inputs_from:
      - handle: url
        from_flow:
          - input_handle: url
        from_node:
          []
    task: web-crawler::crawler
  - node_id: llm#2
    title: "LLM #2"
    inputs_from:
      - handle: timeout
        value: 30
      - handle: retry_times
        value: 0
      - handle: retry_sleep
        value: 3.5
      - handle: stream
        value: true
      - handle: model
        value:
          model: deepseek-chat
          temperature: 0
          top_p: 0.5
          max_tokens: 4096
        from_node:
          []
      - handle: template
        value:
          - role: system
            content: Read {{input}}generates a plain text name based on the content, and
              characters and spaces must not be used.
        schema_overrides:
          - schema:
              type: array
        from_node:
          []
      - handle: input
        value: ""
        from_node:
          - node_id: crawler#1
            output_handle: content
    task: llm::llm
    inputs_def:
      - handle: input
        description: "Website content to extract comic name from"
        json_schema:
          type: string
    outputs_def:
      - handle: name
        description: "Generated plain text name for the comic without special characters"
        json_schema:
          type: string
        nullable: false
description: "Input a comic website URL to download comic images from the page
  and generate an EPUB format comic e-book locally"
inputs_def:
  - handle: url
    json_schema:
      type: string
      nullable: true
    nullable: false
    description: "Comic website URL to search and download from"
    executor_name: nodejs
  - handle: save_dir
    description: "Directory where the downloaded comic archive will be saved"
    json_schema:
      type: string
      ui:widget: dir
    nullable: false
    executor_name: python
outputs_def:
  - handle: archive_path
    description: "Path to the generated comic archive file (CBZ, CBR, EPUB, or PDF)"
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        excludeAll: true
        filters:
          - name: CBZ
            extensions:
              - cbz
          - name: CBR
            extensions:
              - cbr
          - name: EPUB
            extensions:
              - epub
          - name: PDF
            extensions:
              - pdf
    nullable: false
    executor_name: python
outputs_from:
  - handle: archive_path
    from_node:
      - node_id: archive#1
        output_handle: archive_path
title: comic-crawler-download
